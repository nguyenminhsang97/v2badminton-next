name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js cache
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('apps/web/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      # Workaround for npm/cli#4828: the package-lock.json was generated on
      # Windows. While its optionalDependencies field correctly lists every
      # @rolldown/binding-* variant, the `packages` resolution section only
      # has an install record for @rolldown/binding-win32-x64-msvc. `npm ci`
      # on Linux therefore can't install the Linux binding, and Vitest 4.x
      # (which uses Rolldown internally) crashes at startup. Explicitly
      # install the Linux binding for this runner without modifying the
      # committed lockfile.
      - name: Install Linux Rolldown binding (npm/cli#4828 workaround)
        run: npm install --no-save @rolldown/binding-linux-x64-gnu

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
